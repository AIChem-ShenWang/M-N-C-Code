name: material
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  # numerical core
  - numpy=1.26.4
  - pandas=2.3.2
  - scipy=1.13.1
  # Excel I/O for every .xlsx file in data/
  - openpyxl=3.1.5
  # machine learning
  - scikit-learn=1.6.1
  - xgboost=2.1.4
  # plotting
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - tqdm=4.67.1
  # data sources: PubChem PUG-View queries of script/stable table generator.py
  # (the USGS tables are read with the pdftotext of poppler-utils, a system
  # package that has to be installed outside conda)
  - requests=2.32.3
  # materials / chemistry reference data and structure I/O
  - mendeleev=0.20.1
  - ase=3.25.0
  # PyPI only
  - pip
  - pip:
      # neither is on conda-forge at these versions; TorchSisso pulls in torch,
      # shap pulls in numba
      - shap==0.49.1
      - TorchSisso==0.1.8
